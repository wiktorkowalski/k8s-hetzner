apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mimir
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mimir.k8s.vicio.ovh`)
      kind: Rule
      services:
        - name: mimir-gateway
          port: 80
  tls:
    certResolver: default
