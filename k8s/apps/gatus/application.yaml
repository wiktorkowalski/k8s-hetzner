apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://twin.github.io/helm-charts
    chart: gatus
    targetRevision: 1.5.0
    helm:
      releaseName: gatus
      valuesObject:
        serviceAccount:
          create: true
          name: gatus
          autoMount: true
        rbac:
          enabled: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        deployment:
          # RWO Longhorn volume — rolling update would deadlock on attach
          strategy: Recreate
        config:
          storage:
            type: sqlite
            path: /data/data.db
            # 86400 = 30d for 30s-interval endpoints (60d for 60s ones)
            maximum-number-of-results: 86400
            maximum-number-of-events: 300
          kubernetes:
            auto-discover: true
            cluster-mode: cluster
            excluded-suffix-names:
              - -headless
              - -metrics
              - -operated
              - -memberlist
            service-default-check-interval: 60s
            service-default-conditions:
              - "[STATUS] any 200, 301, 302, 403"
          endpoints:
            - name: Kubernetes API
              group: Infrastructure
              url: https://kubernetes.default.svc:443/healthz
              client:
                insecure: true
              interval: 30s
              conditions:
                - "[STATUS] == any(200, 401)"
            - name: Traefik
              group: Infrastructure
              url: http://traefik-metrics.traefik.svc:9100/metrics
              interval: 30s
              conditions:
                - "[STATUS] == 200"
            - name: ArgoCD
              group: Admin
              url: http://argocd-server.argocd.svc:80
              interval: 60s
              conditions:
                - "[STATUS] == any(200, 302)"
            - name: Grafana
              group: Observability
              url: http://kube-prometheus-stack-grafana.monitoring.svc:80/api/health
              interval: 60s
              conditions:
                - "[STATUS] == 200"
            - name: Prometheus
              group: Observability
              url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090/-/ready
              interval: 30s
              conditions:
                - "[STATUS] == 200"
            - name: Alertmanager
              group: Observability
              url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093/-/ready
              interval: 30s
              conditions:
                - "[STATUS] == 200"
            - name: Loki
              group: Observability
              url: http://loki.monitoring.svc:3100/ready
              interval: 30s
              conditions:
                - "[STATUS] == 200"
            - name: Tempo
              group: Observability
              url: http://tempo.monitoring.svc:3200/ready
              interval: 30s
              conditions:
                - "[STATUS] == 200"
            - name: Headlamp
              group: Admin
              url: http://headlamp.headlamp.svc:80
              interval: 60s
              conditions:
                - "[STATUS] == 200"
            - name: Homepage
              group: Admin
              url: http://homepage.homepage.svc:80
              interval: 60s
              conditions:
                - "[STATUS] == 200"
            - name: pgAdmin
              group: Databases
              url: http://pgadmin.postgres.svc:80
              interval: 60s
              conditions:
                - "[STATUS] == any(200, 302)"
        persistence:
          enabled: true
          # Longhorn scheduling pool on agents is ~full (106Gi reserved of ~107Gi
          # schedulable) — expansion beyond 1Gi is rejected by the webhook.
          # 30d of sqlite history is ~200-350MB, fits fine.
          size: 1Gi
          storageClassName: longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: gatus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
