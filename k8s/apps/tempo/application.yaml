apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          # Pin image tag explicitly (chart default tracks appVersion).
          # Bumped 2.9.0 -> 2.9.1 to force a fresh pull: the old in-cluster
          # registry mirror (removed in f46b50c) had cached a wrong-arch
          # 2.9.0 layer on agent-hel1, causing "exec format error" crashloop.
          image:
            tag: "2.9.1"
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
          retention: 2160h
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"

        persistence:
          enabled: true
          storageClassName: longhorn
          size: 30Gi

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
