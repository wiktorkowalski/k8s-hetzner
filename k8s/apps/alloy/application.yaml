apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 0.11.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/k8s/apps/alloy/values.yaml
    - repoURL: https://github.com/wiktorkowalski/k8s-hetzner.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
