app:
  ingress:
    enabled: false
metricsScraper:
  enabled: true
metrics-server:
  enabled: false
nginx:
  enabled: false
cert-manager:
  enabled: false
extraArgs:
  - --enable-skip-login
  - --disable-settings-authorizer
  - --enable-insecure-login
  - --system-banner="K8s Hetzner Production Cluster"
