beyla:
  config:
    discovery:
      services:
        - k8s_namespace: ".*"
          k8s_pod_name: ".*"
          exclude_labels:
            beyla.grafana.com/instrument: "false"

    otel_traces_export:
      endpoint: http://alloy.telemetry.svc.cluster.local:4317
      protocol: grpc
      insecure: true

    otel_metrics_export:
      endpoint: http://alloy.telemetry.svc.cluster.local:4317
      protocol: grpc
      insecure: true

    service_name: "{{ .k8s.namespace }}/{{ .k8s.pod.name }}"
    attributes:
      kubernetes:
        enabled: true

controller:
  kind: DaemonSet

securityContext:
  privileged: true
  capabilities:
    add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - NET_ADMIN

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
