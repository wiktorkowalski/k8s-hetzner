apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.42.0
      helm:
        releaseName: headlamp
        valuesObject:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.io/router.middlewares: traefik-homeonly@kubernetescrd
            hosts:
              - host: headlamp.k8s.vicio.ovh
                paths:
                  - path: /
                    type: Prefix
            tls:
              - secretName: wildcard-k8s-vicio-ovh-tls
                hosts:
                  - headlamp.k8s.vicio.ovh
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
    - repoURL: https://github.com/wiktorkowalski/k8s-hetzner.git
      targetRevision: master
      path: k8s/base/headlamp
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
