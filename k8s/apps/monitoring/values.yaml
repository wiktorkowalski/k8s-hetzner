# Prometheus configuration
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "50GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

    containers:
      - name: prometheus
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL

    # Remote write to Mimir for long-term storage
    remoteWrite:
      - url: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
        queueConfig:
          capacity: 10000
          maxShards: 50
          minShards: 1

# Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

  # Alertmanager configuration for OnCall integration
  config:
    route:
      receiver: 'oncall'
      routes:
        - match:
            severity: critical
          receiver: 'oncall'
    receivers:
      - name: 'oncall'
        webhook_configs:
          - url: 'http://oncall.oncall.svc.cluster.local:8080/api/v1/webhooks/alertmanager/'
            send_resolved: true

# Grafana configuration
grafana:
  enabled: true

  # OIDC authentication via Authentik
  envFromSecret: grafana-oidc

  grafana.ini:
    server:
      root_url: https://grafana.k8s.vicio.ovh

    auth:
      disable_login_form: true
      oauth_auto_login: true

    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: $__env{OIDC_CLIENT_ID}
      client_secret: $__env{OIDC_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.k8s.vicio.ovh/application/o/grafana/authorize/
      token_url: https://auth.k8s.vicio.ovh/application/o/grafana/token/
      api_url: https://auth.k8s.vicio.ovh/application/o/grafana/userinfo/
      use_pkce: true
      use_refresh_token: true
      role_attribute_path: contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-editors') && 'Editor' || 'Viewer'
      allow_sign_up: true

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Additional datasources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.logging.svc.cluster.local
      access: proxy
    - name: Tempo
      type: tempo
      url: http://tempo.tracing.svc.cluster.local:3100
      access: proxy
    - name: Mimir
      type: prometheus
      url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
      access: proxy
      isDefault: false

  # Pre-installed dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Grafana plugins
  plugins:
    - grafana-piechart-panel
    - grafana-clock-panel

# Prometheus Operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Node Exporter (collects node metrics)
nodeExporter:
  enabled: true

# Kube State Metrics (collects k8s object metrics)
kubeStateMetrics:
  enabled: true

# Default rules and alerts
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true
