apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k6-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: k6-operator
      targetRevision: 3.9.0
      helm:
        releaseName: k6-operator
        valueFiles:
          - $values/k8s/apps/k6-operator/values.yaml
    - repoURL: https://github.com/wiktorkowalski/k8s-hetzner.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
