apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 85.3.3
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheus:
          ingress:
            enabled: false
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            resources:
              requests:
                cpu: 200m
                memory: 512Mi

        alertmanager:
          ingress:
            enabled: false
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi

        grafana:
          ingress:
            enabled: false
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: grafana-community
                  orgId: 1
                  folder: Community
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/grafana-community
          dashboards:
            grafana-community:
              traefik:
                gnetId: 17347
                revision: 9
                datasource: Prometheus
              argocd:
                gnetId: 19993
                revision: 7
                datasource: Prometheus
              cilium-hubble:
                gnetId: 16613
                revision: 1
                datasource: Prometheus
              longhorn:
                gnetId: 16888
                revision: 12
                datasource: Prometheus
              loki:
                gnetId: 13186
                revision: 1
                datasource: Prometheus
              tempo:
                gnetId: 23242
                revision: 1
                datasource: Prometheus
              cert-manager:
                gnetId: 20340
                revision: 1
                datasource: Prometheus
              k8s-overview:
                gnetId: 21410
                revision: 7
                datasource: Prometheus
              node-exporter-full:
                gnetId: 1860
                revision: 45
                datasource: Prometheus
              coredns:
                gnetId: 15762
                revision: 22
                datasource: Prometheus
              apiserver:
                gnetId: 15761
                revision: 21
                datasource: Prometheus
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
              isDefault: false
              jsonData:
                derivedFields:
                  - name: TraceID
                    matcherRegex: '"traceID":"(\w+)"'
                    url: "$${__value.raw}"
                    datasourceUid: tempo
                    urlDisplayLabel: View Trace
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3200
              access: proxy
              isDefault: false
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true

        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
