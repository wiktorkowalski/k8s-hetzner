apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 85.3.3
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheus:
          ingress:
            enabled: false
          prometheusSpec:
            externalUrl: https://prometheus.k8s.vicio.ovh
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 90d
            retentionSize: 42GiB # size cap so the 50Gi PVC can't fill before 90d time-retention ever triggers (data is only ~38d old, grows ~1GiB/day → would fill ~2026-07-13 without this)
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: 'etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket'
                action: drop
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi

        alertmanager:
          ingress:
            enabled: false
          alertmanagerSpec:
            externalUrl: https://alertmanager.k8s.vicio.ovh
            replicas: 3
            secrets:
              - discord-webhook
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
          config:
            global:
              resolve_timeout: 5m
              slack_api_url_file: /etc/alertmanager/secrets/discord-webhook/url
            route:
              receiver: discord
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: 'null'
                  matchers:
                    - alertname = "Watchdog"
                - receiver: 'null'
                  matchers:
                    - alertname = "InfoInhibitor"
                - receiver: 'null'
                  matchers:
                    - alertname = "ArgoCDAppOutOfSync"
                    - name = "beyla"
                - receiver: discord
            receivers:
              - name: 'null'
              - name: discord
                slack_configs:
                  - send_resolved: true
                    channel: '#cluster-alerts'
                    title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    text: >-
                      {{ range .Alerts }}
                      *{{ .Labels.alertname }}* ({{ .Labels.severity }})
                      {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
                      {{ if .Labels.namespace }}Namespace: `{{ .Labels.namespace }}`{{ end }}
                      {{ if .Labels.pod }}Pod: `{{ .Labels.pod }}`{{ end }}
                      {{ end }}
            inhibit_rules:
              - source_matchers:
                  - severity = "critical"
                target_matchers:
                  - severity =~ "warning|info"
                equal: ['alertname', 'namespace']
              - source_matchers:
                  - alertname = "InfoInhibitor"
                target_matchers:
                  - severity = "info"
                equal: ['namespace']

        grafana:
          ingress:
            enabled: false
          revisionHistoryLimit: 3
          persistence:
            enabled: false
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
              isDefault: false
              jsonData:
                derivedFields:
                  - name: TraceID
                    matcherRegex: '"traceID":"(\w+)"'
                    url: "$${__value.raw}"
                    datasourceUid: tempo
                    urlDisplayLabel: View Trace
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3200
              access: proxy
              isDefault: false
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true

        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

        prometheus-node-exporter:
          # MicroOS SELinux denies reading /host/proc/1/mountinfo, killing the
          # filesystem collector (node_filesystem_* absent); spc_t exempts it (#50)
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seLinuxOptions:
              type: spc_t
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
