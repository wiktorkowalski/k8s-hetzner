apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-vicio-ovh
  namespace: traefik
spec:
  secretName: wildcard-k8s-vicio-ovh-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.k8s.vicio.ovh"
    - "k8s.vicio.ovh"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-k8s-vicio-ovh-tls
