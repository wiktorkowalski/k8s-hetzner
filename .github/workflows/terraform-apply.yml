name: Terraform Apply

# DISABLED 2026-09-01 — the cluster was torn down with `terraform destroy`; the Hetzner
# project is empty. The `push` trigger would recreate all 78 resources (~EUR 125/month) on the
# next commit touching infra/**, so it stays commented out. `workflow_dispatch` remains: to
# rebuild, rerun packer first (the MicroOS snapshots were deleted too), then run this manually.
on:
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - 'infra/**'
  #     - '.github/workflows/terraform-apply.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Terraform Apply"
            echo ""
            echo "**Status:** $STATUS"
            echo "**Commit:** $SHA"
            echo "**Actor:** $ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"
