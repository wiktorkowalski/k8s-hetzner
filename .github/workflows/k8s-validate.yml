name: Kubernetes Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: yamllint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install yamllint
          KUBECONFORM_VERSION=0.6.7
          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: yamllint
        run: yamllint -f github k8s/

      - name: kubeconform
        run: |
          # Skip ArgoCD Application CRDs (kubeconform doesn't know them); validate everything else
          find k8s -name '*.yaml' -print0 \
            | xargs -0 kubeconform \
                -strict \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
